<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja - Social Tools</title>
    <link rel="icon" href="https://github.com/M1DES1/social-tools/raw/refs/heads/main/cwel.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="header">
            <a href="index.html" class="brand">
                <img src="cwel.ico" alt="Social Tools logo" class="brand-logo">
                <div class="brand-copy">
                    <h2>Social Tools</h2>
                    <span>Rejestracja</span>
                </div>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Strona glowna</a>
                <a href="login.html" class="button-secondary">Logowanie</a>
            </nav>
        </header>

        <main class="auth-page">
            <div class="auth-layout">
                <section class="auth-showcase hero-panel">
                    <div class="eyebrow">Rejestracja</div>
                    <h1 class="hero-title">Utworz <span class="accent">konto</span></h1>
                    <p class="hero-subtitle">Szybko i bez zbednych krokow.</p>
                    <div class="mockup">
                        <div class="mockup-topbar">
                            <span></span><span></span><span></span>
                            <strong>account-setup</strong>
                        </div>
                        <div class="spec-list">
                            <div class="spec-item">1. Ustaw dane</div>
                            <div class="spec-item">2. Wejdz dalej</div>
                            <div class="spec-item">3. Pobierz appke</div>
                        </div>
                    </div>
                </section>

                <section class="container">
                    <h1>Rejestracja</h1>
                    <p class="subtitle">Utworz konto.</p>

                    <form id="registrationForm">
                        <div class="form-group">
                            <label for="username">Nazwa uzytkownika</label>
                            <input type="text" id="username" name="username" required minlength="3">
                        </div>
                        <div class="form-group">
                            <label for="password">Haslo</label>
                            <input type="password" id="password" name="password" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Potwierdz haslo</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="termsAccepted" name="termsAccepted" required>
                                Akceptuje regulamin i zobowiazuje sie korzystac z aplikacji zgodnie z prawem, bez naruszania cudzych systemow, kont i danych.
                            </label>
                        </div>
                        <button type="submit">Zarejestruj sie</button>
                    </form>

                    <div class="auth-links">
                        <p>Masz juz konto? <a href="login.html">Zaloguj sie</a></p>
                        <div class="legal-inline-links">
                            <a href="privacy.html">Privacy</a>
                            <a href="regulamin.html">Regulamin</a>
                        </div>
                    </div>

                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Trwa rejestracja...</p>
                    </div>

                    <div class="message" id="message"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="site.js"></script>
    <script src="register.js"></script>
</body>
</html>
